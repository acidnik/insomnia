[package]
name = "insomnia"
version = "0.1.0"
edition = "2021"
description = "File-based monitoring daemon: checks are scripts with meta headers"

[dependencies]
anyhow = "1"
dirs = "6"
libc = "0.2"
notify = "8"
regex = "1"
regex-lite = "0.1"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
strip = true
lto = true
